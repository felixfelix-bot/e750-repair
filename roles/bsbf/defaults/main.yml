---
# BSBF client defaults. The server credentials have no defaults: pass them in.
bsbf_server_ipv4: ""
bsbf_server_port: 0
bsbf_client_uuid: ""

bsbf_apn: "internet.eplus.de"
bsbf_sta_interface: "phy1-sta0"
bsbf_cellular_interface: "wwan0"
bsbf_cellular_uci: "wwan1"
bsbf_wifi_metric: 9
# bsbf-mptcp rotates the default routes and resets them when a metric would
# exceed 16, so keep the base metrics small.
bsbf_cellular_metric: 13
bsbf_backup_interfaces:
  - wwan0

# Interfaces whose forwarded traffic must NOT be intercepted by the BSBF
# tproxy. The captive portal's br-portal uses the normal WAN/NAT path.
bsbf_tproxy_bypass_interfaces:
  - br-portal

# Authenticated captive-portal clients are tproxied by a separate table at a
# later hook priority (-140), after nodogsplash has marked them 0x30000. The
# bypass above still keeps pre-auth and non-TCP/UDP traffic out of the tunnel.
bsbf_portal_tproxy: true
bsbf_portal_interface: "br-portal"
bsbf_portal_network: "10.0.0.0/24"
bsbf_portal_ip: "10.0.0.1"
# Portal redirect port. BSBF keeps 127.0.0.1:12345; the portal uses a second
# inbound in the same xray process so neither can reset the other.
bsbf_portal_tproxy_port: 12346

# Packages required for MBIM, MPTCP endpoint management, and the BSBF client.
bsbf_packages:
  - curl
  - kmod-usb-net-cdc-mbim
  - umbim
  - ip-full
  - kmod-ifb
  - kmod-nf-tproxy
  - kmod-nft-tproxy
  - bsbf-bonding
  - bsbf-quectel-usbnet
  - bsbf-autoconf-cellular
  - bsbf-autoconf-dhcp

# The upstream MPTCP support probe (mptcpize + check.mptcp.dev) returns
# "not using MPTCP" on this musl/ath79 build even though the kernel data path
# works. The role replaces only that probe with a positive result; the actual
# MPTCP connection is still verified end-to-end.
bsbf_patch_mptcp_probe: true
