---
# BSBF client on the GL-E750. All target commands use `raw`: a stock OpenWrt
# image has no Python, so the normal Ansible module path is unavailable.

- name: Read the board name
  ansible.builtin.raw: cat /tmp/sysinfo/board_name
  register: _bsbf_board
  changed_when: false

- name: Refuse to run on a different board
  ansible.builtin.assert:
    that:
      - _bsbf_board.stdout | trim == 'glinet,gl-e750'
    fail_msg: "Expected glinet,gl-e750; got {{ _bsbf_board.stdout | trim }}"

- name: Read the OpenWrt release
  ansible.builtin.raw: . /etc/openwrt_release; echo "$DISTRIB_RELEASE"
  register: _bsbf_release
  changed_when: false

- name: Refuse to run outside OpenWrt 25.12
  ansible.builtin.assert:
    that:
      - _bsbf_release.stdout is search('^25\\.12\\.')
    fail_msg: "Expected OpenWrt 25.12.x; got {{ _bsbf_release.stdout | trim }}"

- name: Read the MPTCP kernel switch
  ansible.builtin.raw: cat /proc/sys/net/mptcp/enabled
  register: _bsbf_mptcp
  changed_when: false

- name: Require kernel MPTCP
  ansible.builtin.assert:
    that:
      - _bsbf_mptcp.stdout | trim == '1'
    fail_msg: "Kernel MPTCP is not enabled"

- name: Read free overlay space
  ansible.builtin.raw: df -k /overlay | tail -1 | awk '{print $4}'
  register: _bsbf_df
  changed_when: false

- name: Require at least 20 MB free
  ansible.builtin.assert:
    that:
      - _bsbf_df.stdout | int > 20480
    fail_msg: "Less than 20 MB free on /overlay"

- name: Refresh the apk index
  ansible.builtin.raw: apk update
  register: _bsbf_apk_update
  changed_when: true

- name: Install the BSBF client packages
  ansible.builtin.raw: "apk add {{ bsbf_packages | join(' ') }}"
  register: _bsbf_apk
  changed_when: "'Installing' in _bsbf_apk.stdout"

- name: Read the MBIM control device
  ansible.builtin.raw: ls -l /dev/cdc-wdm0
  register: _bsbf_wdm
  changed_when: false
  failed_when: false

- name: Require the MBIM control device
  ansible.builtin.assert:
    that:
      - _bsbf_wdm.rc == 0
    fail_msg: >-
      /dev/cdc-wdm0 is missing after installing kmod-usb-net-cdc-mbim and
      umbim. The modem is not in MBIM mode; run bsbf-quectel-usbnet once and
      reboot, then re-run this playbook.

- name: Configure the cellular WAN and the STA metric
  ansible.builtin.raw: |
    set -e
    uci set network.{{ bsbf_cellular_uci }}='interface'
    uci set network.{{ bsbf_cellular_uci }}.device='/dev/cdc-wdm0'
    uci set network.{{ bsbf_cellular_uci }}.proto='mbim'
    uci set network.{{ bsbf_cellular_uci }}.apn='{{ bsbf_apn }}'
    uci set network.{{ bsbf_cellular_uci }}.pdptype='ipv4'
    uci set network.{{ bsbf_cellular_uci }}.metric='{{ bsbf_cellular_metric }}'
    uci set network.{{ bsbf_cellular_uci }}.disabled='0'
    uci set network.wwan.metric='{{ bsbf_wifi_metric }}'
    uci delete network.wan1 2>/dev/null || true
    uci commit network
  changed_when: true

- name: Bring up the cellular WAN
  ansible.builtin.raw: |
    /etc/init.d/network reload >/dev/null 2>&1 || true
    ifup {{ bsbf_cellular_uci }} 2>/dev/null || true
    for i in $(seq 1 40); do
      ifstatus {{ bsbf_cellular_uci }} 2>/dev/null | grep -q '"up": true' && exit 0
      sleep 2
    done
    exit 1
  changed_when: false

- name: Disable the Quectel AT probe
  ansible.builtin.raw: /etc/init.d/bsbf-quectel-usbnet disable 2>/dev/null || true
  changed_when: false

- name: Write the BSBF client configuration
  ansible.builtin.raw: >-
    umask 077 && mkdir -p /etc/bsbf &&
    printf 'server_ipv4=%s\nserver_port=%s\nuuid=%s\n'
    '{{ bsbf_server_ipv4 }}' '{{ bsbf_server_port }}' '{{ bsbf_client_uuid }}'
    > /etc/bsbf/bsbf-bonding.conf &&
    chmod 600 /etc/bsbf/bsbf-bonding.conf
  no_log: true
  changed_when: true

- name: Check the MPTCP probe patch
  ansible.builtin.raw: >-
    grep -q 'OUTPUT="You are using MPTCP."' /usr/sbin/bsbf-mptcp
    && grep -q '1.1.1.1' /usr/sbin/bsbf-mptcp
    && grep -q 'if ! ip mp e | grep -q "dev $IFACE"; then' /usr/sbin/bsbf-mptcp
    && echo patched || echo unpatched
  register: _bsbf_probe
  changed_when: false

- name: Bypass the broken MPTCP support probe
  ansible.builtin.raw: |
    cp -n /usr/sbin/bsbf-mptcp /usr/sbin/bsbf-mptcp.orig
    sed -i 's#OUTPUT=$(mptcpize run curl $CURL_ARGS --interface "$IFACE")#OUTPUT="You are using MPTCP."#' /usr/sbin/bsbf-mptcp
    sed -i 's/5\.196\.67\.207/1.1.1.1/g' /usr/sbin/bsbf-mptcp
    sed -i 's#if ! grep -xq "$IFACE" /run/bsbf-mptcp-supported; then#if ! ip mp e | grep -q "dev $IFACE"; then#' /usr/sbin/bsbf-mptcp
  when:
    - bsbf_patch_mptcp_probe | bool
    - "'patched' not in _bsbf_probe.stdout"
  changed_when: true

- name: Declare backup subflows
  ansible.builtin.raw: >-
    printf '%s\n' {{ bsbf_backup_interfaces | map('quote') | join(' ') }}
    > /etc/bsbf/bsbf-mptcp-subflow-backup
  changed_when: true

- name: Install the patched nft boot hook (cold boot + tproxy bypass)
  ansible.builtin.raw: |
    set -e
    cat > /etc/init.d/bsbf-bonding-nft <<'E750_NFT_EOF'
    {{ lookup('file', 'bsbf-bonding-nft') }}
    E750_NFT_EOF
    chmod +x /etc/init.d/bsbf-bonding-nft
    grep -n 'tproxy-bypass.sh' /etc/init.d/bsbf-bonding-nft
  changed_when: true

- name: Record the expected BSBF egress
  ansible.builtin.raw: |
    set -e
    mkdir -p /etc/e750
    printf '%s\n' '{{ bsbf_server_ipv4 }}' > /etc/e750/expected-egress
    chmod 644 /etc/e750/expected-egress
    cat /etc/e750/expected-egress
  changed_when: true

- name: Install the tproxy bypass helper
  ansible.builtin.raw: |
    set -e
    cat > /etc/bsbf/tproxy-bypass.sh <<'E750_BYPASS_EOF'
    {{ lookup('file', 'tproxy-bypass.sh') }}
    E750_BYPASS_EOF
    chmod 755 /etc/bsbf/tproxy-bypass.sh
    printf '%s\n' {{ bsbf_tproxy_bypass_interfaces | map('quote') | join(' ') }} > /etc/bsbf/tproxy-bypass-interfaces
    cat /etc/bsbf/tproxy-bypass-interfaces
  changed_when: true

- name: Prepare the nft table and enable BSBF
  ansible.builtin.raw: |
    modprobe nft_tproxy 2>/dev/null || true
    nft list table ip bsbf_bonding >/dev/null 2>&1 || nft add table ip bsbf_bonding
    bsbf-bonding --enable
    /etc/bsbf/tproxy-bypass.sh
  register: _bsbf_enable
  changed_when: true

- name: Persist route_localnet for the tproxy
  ansible.builtin.raw: |
    set -e
    cat > /etc/sysctl.d/99-bsbf-tproxy.conf <<'E750_SYSCTL_EOF'
    net.ipv4.conf.all.route_localnet=1
    net.ipv4.conf.default.route_localnet=1
    E750_SYSCTL_EOF
    sysctl -w net.ipv4.conf.all.route_localnet=1 >/dev/null
    sysctl -w net.ipv4.conf.default.route_localnet=1 >/dev/null
    cat /proc/sys/net/ipv4/conf/all/route_localnet
  changed_when: true

- name: Install the portal-over-bond helper
  ansible.builtin.raw: |
    set -e
    mkdir -p /etc/bsbf
    cat > /etc/bsbf/portal-tproxy.sh <<'E750_PORTAL_EOF'
    {{ lookup('file', 'portal-tproxy.sh') }}
    E750_PORTAL_EOF
    chmod 755 /etc/bsbf/portal-tproxy.sh
  when: bsbf_portal_tproxy | bool

- name: Ensure jq is available for the xray config patch
  ansible.builtin.raw: |
    command -v jq >/dev/null 2>&1 && exit 0
    if command -v apk >/dev/null 2>&1; then apk add jq >/dev/null 2>&1
    elif command -v opkg >/dev/null 2>&1; then opkg install jq >/dev/null 2>&1
    fi
    command -v jq >/dev/null 2>&1
  when: bsbf_portal_tproxy | bool
  changed_when: false

- name: Ensure xray has both the BSBF and portal inbounds
  ansible.builtin.raw: |
    set -e
    # One xray process, two inbounds: BSBF owns 127.0.0.1:12345, the portal
    # owns {{ bsbf_portal_ip }}:{{ bsbf_portal_tproxy_port }}. Neither service
    # can reset the other's listener. Patch the package template too, so a
    # later `bsbf-bonding --enable` reproduces the same two-inbound config.
    JQ_BOTH='.inbounds = [
      {"listen":"127.0.0.1","port":12345,"protocol":"tunnel",
       "settings":{"network":"tcp,udp","followRedirect":true},
       "streamSettings":{"sockopt":{"tproxy":"tproxy"}}},
      {"listen":"{{ bsbf_portal_ip }}","port":{{ bsbf_portal_tproxy_port }},
       "protocol":"dokodemo-door",
       "settings":{"network":"tcp","followRedirect":true}}
    ]'
    for f in /usr/share/bsbf/xray.json /etc/xray/config.json; do
      [ -f "$f" ] || continue
      [ -f "$f.bak" ] || cp "$f" "$f.bak"
      jq "$JQ_BOTH" "$f" > "$f.new" && mv "$f.new" "$f"
    done
    # The stock init passes both -confdir /etc/xray and -config
    # /etc/xray/config.json; that loads the file twice and makes both inbounds
    # bind the same port. Keep only the explicit conffile.
    uci -q delete xray.config.confdir
    uci commit xray
    if [ -f /etc/xray/config.json ]; then
      /etc/init.d/xray restart 2>/dev/null || /etc/init.d/xray reload 2>/dev/null || true
      sleep 3
      netstat -ltn 2>/dev/null | grep ':12345 ' >/dev/null || {
        echo 'xray did not listen on 12345'; exit 1; }
      netstat -ltn 2>/dev/null | grep ':{{ bsbf_portal_tproxy_port }} ' >/dev/null || {
        echo 'xray did not listen on {{ bsbf_portal_tproxy_port }}'; exit 1; }
    fi
    echo xray-two-inbounds
  when: bsbf_portal_tproxy | bool
  changed_when: true

- name: Route authenticated portal clients through BSBF
  ansible.builtin.raw: |
    modprobe nft_redir 2>/dev/null || true
    BSBF_PORTAL_IFACE='{{ bsbf_portal_interface }}' \
    BSBF_PORTAL_NETWORK='{{ bsbf_portal_network }}' \
    BSBF_PORTAL_IP='{{ bsbf_portal_ip }}' \
    BSBF_PORTAL_TPROXY_PORT='{{ bsbf_portal_tproxy_port }}' \
      /etc/bsbf/portal-tproxy.sh
    nft list chain inet bsbf_portal prerouting | head -8
    nft list chain ip filter ndsRTR 2>/dev/null | grep 'bsbf-portal-redirect' | head -1
    nft list chain inet fw4 input 2>/dev/null | grep 'bsbf-portal-redirect' | head -1
  register: _bsbf_portal_tproxy
  changed_when: true
  when: bsbf_portal_tproxy | bool

- name: Keep the portal redirect allowlist after nodogsplash reloads
  ansible.builtin.raw: |
    touch /etc/crontabs/root
    grep -q 'portal-tproxy.sh --ensure' /etc/crontabs/root || \
      echo '* * * * * /etc/bsbf/portal-tproxy.sh --ensure >/dev/null 2>&1' >> /etc/crontabs/root
    /etc/init.d/cron restart >/dev/null 2>&1 || true
    grep 'portal-tproxy.sh --ensure' /etc/crontabs/root
  when: bsbf_portal_tproxy | bool
  changed_when: true

- name: Show the tproxy bypass
  ansible.builtin.raw: |
    nft list chain ip bsbf_bonding prerouting_mangle | head -8
  register: _bsbf_bypass
  changed_when: false

- name: Reset the endpoint cache and restart bsbf-mptcp
  ansible.builtin.raw: |
    : > /run/bsbf-mptcp-supported
    : > /run/bsbf-mptcp-not-supported
    : > /run/bsbf-mptcp-no-connectivity
    /etc/init.d/bsbf-mptcp restart
  changed_when: true

- name: Wait for both MPTCP endpoints
  ansible.builtin.raw: |
    for i in $(seq 1 30); do
      if ip mp e 2>/dev/null | grep -q 'dev {{ bsbf_sta_interface }}' \
         && ip mp e 2>/dev/null | grep -q 'backup dev {{ bsbf_cellular_interface }}'; then
        exit 0
      fi
      sleep 1
    done
    exit 1
  changed_when: false

- name: Report the live endpoint table
  ansible.builtin.raw: ip mp e
  register: _bsbf_endpoints
  changed_when: false

- name: Report the BSBF status
  ansible.builtin.raw: bsbf-bonding --status
  register: _bsbf_status
  changed_when: false

- name: Show the client state
  ansible.builtin.debug:
    msg:
      - "endpoints:"
      - "{{ _bsbf_endpoints.stdout_lines }}"
      - "status: {{ _bsbf_status.stdout | trim }}"
